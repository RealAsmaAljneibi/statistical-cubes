[project]
name = "cube-builder"
version = "0.1.0"
description = "Interactive statistical cube builder built with marimo"
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.9",
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
